<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار البلاغة التفاعلي - علم المعاني</title>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #16a085;
            --background-color: #f5f7fa;
            --card-background: #ffffff;
            --text-color: #333333;
            --success-color: #27ae60;
            --error-color: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }

        .quiz-card {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-color);
            line-height: 1.6;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: right;
            font-size: 1.1rem;
            cursor: pointer;
            transition: flip 0.2s, border-color 0.2s, background-color 0.2s;
        }

        .option-btn:hover {
            border-color: var(--secondary-color);
            background-color: #f0fdfa;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.05rem;
            line-height: 1.5;
            display: none;
            border-right: 5px solid;
        }

        .feedback.correct-style {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-color: var(--success-color);
        }

        .feedback.incorrect-style {
            background-color: #ffebee;
            color: #c62828;
            border-color: var(--error-color);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .nav-btn:hover {
            background-color: #1a252f;
        }

        .nav-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .progress-bar {
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--secondary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        #result-card {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>اختبار البلاغة التفاعلي</h1>
        <p>مباحث علم المعاني: الخبر والإنشاء والأساليب الإنشائية ومعانيها المجازية</p>
<p>تصميم وتطوير: أ:عبد الله بن علي المطرفي</p>
    </header>

    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div class="quiz-card" id="quiz-box">
        <div id="question-number" style="color: var(--secondary-color); font-weight: bold; margin-bottom: 10px;"></div>
        <div class="question-text" id="question-text">جاري تحميل السؤال...</div>
        <div class="options-container" id="options-container">
            </div>
        <div class="feedback" id="feedback-box"></div>
        
        <div class="navigation">
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ←</button>
        </div>
    </div>

    <div class="quiz-card" id="result-card">
        <h2>تهانينا! لقد أتممت الاختبار</h2>
        <div class="score-circle" id="score-display">0/0</div>
        <p id="result-message" style="font-size: 1.2rem;"></p>
        <button class="nav-btn" onclick="restartQuiz()">إعادة الاختبار</button>
    </div>
</div>

<script>
    // بنية بيانات الأسئلة
    const quizData = [
        {
            question: "ما نوع الأسلوب في قوله تعالى: {وَبِالْوَالِدَيْنِ إِحْسَانًا}؟",
            options: ["إنشائي طلبي (أمر)", "إنشائي غير طلبي", "خبري لفظاً إنشائي معنى", "خبري محص"],
            correct: 0,
            feedback: "التغذية الراجعة: المصدر 'إحساناً' نائب عن فعل الأمر المحذوف (أحسنوا)، ليكون الأسلوب إنشائياً طلبياً صيغته الأمر عبر المصدر النائب عن فعله."
        },
        {
            question: "حدد ضرب الخبر في قوله تعالى: {إِنَّ إِلَهَكُمْ لَوَاحِدٌ}؟",
            options: ["ابتدائي", "طلبي", "إنكاري", "إنشائي غير طلبي"],
            correct: 2,
            feedback: "التغذية الراجعة: الخبر هنا 'إنكاري' لاشتماله على أكثر من مؤكد (إنّ، ولام الابتداء المزحلقة في 'لواحد')، ويُساق هذا الضرب لمن كان منكراً للجاحد."
        },
        {
            question: "ما الغرض المجازي للأمر في قول امرئ القيس: 'أَلا أَيُّهَا اللَّيْلُ الطَّوِيلُ ألا انْجَلِي'؟",
            options: ["الدعاء", "التمني", "الالتماس", "التعجيز"],
            correct: 1,
            feedback: "التغذية الراجعة: يخرج الأمر إلى 'التمني' إذا كان موجهاً لما لا يعقل، حيث يطلب الشاعر من الليل أن ينقشع، وهو يعلم أنه لا يملك إرادة الاستجابة."
        },
        {
            question: "قوله تعالى: {رَبِّ إِنِّي وَضَعْتُهَا أُنْثَى}، ما الغرض البلاغي من سياق هذا الخبر؟",
            options: ["إفادة المخاطب بالحكم", "إظهار التحسر والضعف", "الفخر والاعتزاز", "التوبيخ"],

        },
        {
            question: "ما نوع الأسلوب الإنشائي في قوله تعالى: {وَلَا تَحْسَبَنَّ اللَّهَ غَافِلًا عَمَّا يَعْمَلُ الظَّالِمُونَ}؟",
            options: ["إنشائي طلبي (نهي)", "إنشائي طلبي (أمر)", "إنشائي غير طلبي", "أسلوب خبري"],
            correct: 0,
            feedback: "التغذية الراجعة: الأسلوب إنشائي طلبي بصيغة 'النهي' المكونة من لا الناهية والفعل المضارع المؤكد بنون التوكيد."
        },
        {
            question: "إلى أي معنى خرج النهي في قول الشاعر: 'لا تطلب المجد إن المجد سلمه صعب'؟",
            options: ["التحقير والتقليل", "الدعاء", "الالتماس", "التهديد"],

        },
        {
            question: "ما المعنى المجازي للاستفهام في قوله تعالى: {هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ}؟",
            options: ["التقرير", "الإنكار", "النفي", "التشويق"],
            correct: 2,
            feedback: "التغذية الراجعة: الاستفهام هنا معناه 'النفي'؛ بدليل صحة إحلال أداة النفي مكانه، أي: (ما جزاءُ الإحسان إلا الإحسان)."
        },
        {
            question: "أي من الأساليب التالية يعتبر أسلوباً إنشائياً 'غير طلبي'؟",
            options: ["يا ليتني كنت معهم", "لعمري لأفعلن الخير", "أقم الصلاة لذلوك الشمس", "لا تنه عن خلق وتأتي مثله"],
            correct: 1,
            feedback: "التغذية الراجعة: القسم (لعمري) من صيغ الإنشاء غير الطلبي، بينما التمني والطلب والنهي في الخيارات الأخرى هي من الإنشاء الطلبي."
        },
        {
            question: "ما الغرض البلاغي من النداء في قول المتنبي: 'يَا أَعْدَلَ النَّاسِ إِلاَّ فِي مُعَامَلَتِي'؟",
            options: ["التعظيم", "العتاب", "التحسر", "الاستغاثة"],
            correct: 1,
            feedback: "التغذية الراجعة: يوجه المتنبي نداءه لسيف الدولة بصيغة 'يا أعدل الناس'، متبوعاً باستثناء يعبر فيه عن ألمه، فالغرض هنا هو العتاب الرقيق."
        },
        {
            question: "إذا كان المخاطب خالي الذهن من الحكم، فما هو ضرب الخبر المناسب له؟",

            correct: 2,
            feedback: "التغذية الراجعة: خالي الذهن يُلقى إليه الخبر خالياً من أدوات التوكيد، ويسمى هذا الضرب بالخبر 'الابتدائي'."
        },
{
question: "س11: ما ضرب الخبر في الآية التالية عندما كذّبهم قومهم: {قَالُوا رَبُّنَا يَعْلَمُ إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ}؟",
options: ["ابتدائي", "طلبي", "إنكاري", "إنشائي غير طلبي"],
correct: 2,
feedback: "التغذية الراجعة: الضرب 'إنكاري'؛ لأن المخاطبين كذّبوهم، فزادوا في التوكيد باستخدام: القسم (ربنا يعلم) + (إنّ) + (لام الابتداء المزحلقة في لمرسلون)."
},
{
question: "س12: أي الأساليب التالية يعتبر أسلوباً إنشائياً؟",
options: ["حافظَ الطالبُ على صلاته", "يا طالب العلمِ، حافظْ على صلاتك", "إنَّ المحافظةَ على الصلاةِ واجبة", "المحافظةُ على الصلاةِ تنير القلب"],
correct: 1,
feedback: "التغذية الراجعة: الجملة الثانية تشتمل على نداء (يا طالب) وأمر (حافظْ)، وكلاهما من أساليب الإنشاء الطلبي."
},
{
question: "س13: ما الأداة المؤكدة للخبر في جملة: 'لعَمْرُكَ إنَّ الحقَّ منصورٌ'؟",
options: ["إنَّ فقط", "القسم (لعمرك) فقط", "القسم (لعمرك) وحرف التوكيد (إنَّ)", "لا يوجد أدوات توكيد"],
correct: 2,
feedback: "التغذية الراجعة: اشتملت الجملة على مؤكدين هما: أسلوب القسم (لعمرك)، والحرف المشبه بالفعل (إنَّ)؛ مما يجعل الخبر إنكارياً."
},
{
question: "س14: عندما نقول للمخاطب: 'أنت تعلَمُ أني لم أقصرْ في واجبي'، ما الغرض البلاغي من هذا الخبر؟",
options: ["فائدة الخبر", "لازم الفائدة", "التحسر", "المدح"],
correct: 1,
feedback: "التغذية الراجعة: الغرض هو 'لازم الفائدة'؛ لأن المخاطب يعلم مضمون الخبر أصلاً، والمتكلم يريد فقط إعلامه بأنه يعرف أنه على علمٍ بذلك."
},
{
question: "س15: قوله تعالى: {وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ}، يُصنف الخبر في الآية على أنه:",
options: ["ابتدائي", "طلبي", "إنكاري", "إنشائي"],
correct: 0,
feedback: "التغذية الراجعة: الخبر 'ابتدائي'؛ لخلو الآية الكريمة من أي مؤكد من مؤكدات الحكم البلاغية."
},
{
question: "س16: الجملة التي تدل على أمر لا يحتمل الصدق أو الكذب تسمى في البلاغة أسلوباً:",
options: ["خبرياً", "إنشائياً", "حقيقياً", "مجازياً"],
correct: 1,
feedback: "التغذية الراجعة: الأسلوب الإنشائي هو الكلام الذي لا يصح أن يقال لقائله إنه صادق فيه أو كاذب، لأنه ينشئ طلباً أو معنى جديداً."
},
{
question: "س17: ما نوع التوكيد المستخدم في قوله تعالى: {وَالْعَصْرِ (1) إِنَّ الْإِنسَانَ لَفِي خُسْرٍ}؟",
options: ["مؤكد واحد", "مؤكدان", "ثلاثة مؤكدات", "خالٍ من المؤكدات"],
correct: 2,
feedback: "التغذية الراجعة: الآية تشتمل على ثلاثة مؤكدات: القسم (والعصر) + حرف التوكيد (إنَّ) + لام الابتداء المزحلقة (لَفِي خُسْرٍ)، فالخبر هنا إنكاري قوي."
},
{
question: "س18: الأسلوب الإنشائي ينقسم في علم المعاني إلى قسمين رئيسين هما:",

correct: 1,

question: "س19: قوله تعالى: {الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ}، ما نوع الأسلوب البلاغي هنا؟",

options: ["إنشائي طلبي (أمر)", "إنشائي غير طلبي (تعجب)", "إنشائي طلبي (التماس)", "خبري لفظاً إنشائي معنى"],

question: "س23: ما المعنى المجازي الذي خرج إليه الأمر في قولك لزميلك: 'ناولني القلمَ يا أخي'؟",

},
{
question: "س25: ما المعنى المجازي للأمر في قول الخنساء: 'أَعيْنَيَّ جودا وَلا تَجمُدا'؟",
options: ["التمني", "التهديد", "التعجيز", "الإرشاد"],

},
{
question: "س26: قول الوالد لولده المتكاسل: 'استمر في اللعب وسترى النتيجة'، خرج الأمر هنا إلى غرض:",
options: ["الإباحة", "التهديد", "التخيير", "النصح"],
correct: 1,
feedback: "التغذية الراجعة: سياق الكلام يدل على عدم الرضا والوعيد بالعقوبة، فالأمر هنا غرضه 'التهديد'."

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainerEl = document.getElementById('options-container');
    const feedbackBoxEl = document.getElementById('feedback-box');
    const nextBtnEl = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');
    const quizBoxEl = document.getElementById('quiz-box');
    const resultCardEl = document.getElementById('result-card');
    const scoreDisplayEl = document.getElementById('score-display');
    const resultMessageEl = document.getElementById('result-message');

    function loadQuestion() {
        answered = false;
        feedbackBoxEl.style.display = 'none';
        nextBtnEl.style.opacity = '0.5';
        nextBtnEl.disabled = true;
        
        let currentQuestion = quizData[currentQuestionIndex];
        
        // تحديث شريط التقدم الرقمي والبياني
        questionNumberEl.innerText = `السؤال ${currentQuestionIndex + 1} من ${quizData.length}`;
        progressEl.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
        
        questionTextEl.innerText = currentQuestion.question;
        optionsContainerEl.innerHTML = '';

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.classList.add('option-btn');
            button.innerText = option;
            button.onclick = () => selectOption(index, button);
            optionsContainerEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        if (answered) return; // منع تعديل الإجابة
        answered = true;
        
        let currentQuestion = quizData[currentQuestionIndex];
        const buttons = optionsContainerEl.querySelectorAll('.option-btn');
        
        if (selectedIndex === currentQuestion.correct) {
            score++;
            selectedBtn.classList.add('correct');
            feedbackBoxEl.className = "feedback correct-style";
        } else {
            selectedBtn.classList.add('incorrect');
            buttons[currentQuestion.correct].classList.add('correct');
            feedbackBoxEl.className = "feedback incorrect-style";
        }
        
        feedbackBoxEl.innerText = currentQuestion.feedback;
        feedbackBoxEl.style.display = 'block';
        
        nextBtnEl.removeAttribute('disabled');
        nextBtnEl.style.opacity = '1';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        progressEl.style.width = '100%';
        quizBoxEl.style.display = 'none';
        resultCardEl.style.display = 'block';
        scoreDisplayEl.innerText = `${score} / ${quizData.length}`;
        
        let message = "";
        if (score === quizData.length) {
            message = "ممتاز! أنت عبقري في علم البلاغة العربية.";
        } else if (score >= quizData.length * 0.7) {
            message = "أحسنت! إلمامك بقواعد علم المعاني وأساليبه جيد جداً.";
        } else {
            message = "محاولة جيدة، ننصحك بإعادة مراجعة الأساليب البلاغية والمعاني المجازية.";
        }
        resultMessageEl.innerText = message;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizBoxEl.style.display = 'block';
        resultCardEl.style.display = 'none';
        loadQuestion();
    }

    // بدء تشغيل الاختبار عند تحميل الصفحة
    window.onload = loadQuestion;
</script>
